# Add this service to your media stack. Replace bryansimp if your GitHub username differs (must be lowercase).
services:
  reencoder:
    image: ghcr.io/bryansimp/reencoder:latest
    container_name: reencoder
    restart: unless-stopped
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "993"            # host render group
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /home/bryan/reencoder:/config
      - /mnt/hard2/media:/data/media
      - /mnt/hard1/media:/data/media2
      - /mnt/hard3/media:/data/media3
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
      - UI_USER=admin
      - UI_PASS=change-me   # set a real password
      - LOG_LEVEL=INFO
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.reencoder.rule=Host(`reencoder.brysimp.com`)"
      - "traefik.http.routers.reencoder.entrypoints=websecure"
      - "traefik.http.routers.reencoder.tls.certresolver=cloudflare"
      - "traefik.http.services.reencoder.loadbalancer.server.port=8080"

networks:
  proxy:
    external: true
