# Encody: its own stack. Paste into a Portainer stack (or: docker compose -f deploy/docker-compose.yml up -d)
# and set UI_PASS (and optionally UI_USER) in the stack environment.
#
# Image is built by GitHub Actions on every push to main (ghcr.io/bryansimp/encody).
# The existing watchtower (game manager stack, WATCHTOWER_LABEL_ENABLE=true) auto-updates
# this container because of the watchtower label below. An update restarts the container;
# a file being encoded at that moment is safely abandoned and redone later (original untouched).
services:
  encody:
    image: ghcr.io/bryansimp/encody:latest
    container_name: encody
    restart: unless-stopped
    devices:
      - /dev/dri:/dev/dri          # Intel Arc A310 (shared with Jellyfin)
    group_add:
      - "993"                      # host render group
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /home/bryan/encody:/config
      # same container paths as Jellyfin
      - /mnt/hard2/media:/data/media
      - /mnt/hard1/media:/data/media2
      - /mnt/hard3/media:/data/media3
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: ${TZ:-America/Chicago}
      UI_USER: ${UI_USER:-admin}
      UI_PASS: ${UI_PASS:?set in stack env}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.encody.rule=Host(`encody.brysimp.com`)
      - traefik.http.routers.encody.entrypoints=websecure
      - traefik.http.routers.encody.tls.certresolver=cloudflare
      - traefik.http.services.encody.loadbalancer.server.port=8080
      - com.centurylinklabs.watchtower.enable=true

networks:
  proxy:
    external: true
