name: Build and publish image

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg (software AV1 for pipeline tests)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pip install -r requirements.txt pytest httpx
      - run: python -m pytest -q tests

  image:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Image name (GHCR needs lowercase)
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/encody" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Every branch builds the image (catches Dockerfile breakage); only main pushes it.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ${{ steps.name.outputs.image }}:latest
            ${{ steps.name.outputs.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image
        run: |
          docker buildx build --load -t reencoder:test --platform linux/amd64 --cache-from type=gha .
          docker run --rm --entrypoint sh reencoder:test -c '
            ffmpeg -hide_banner -encoders | grep -E "av1_qsv|libsvtav1" &&
            ffprobe -version | head -1 && vainfo --version && python3 -c "import fastapi, uvicorn"'
          docker run -d --name rc -e UI_USER=a -e UI_PASS=b reencoder:test
          IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' rc)
          for i in $(seq 1 30); do curl -fs "http://$IP:8080/health" && break; sleep 1; done
          docker logs rc
          curl -fs "http://$IP:8080/health"
          test "$(curl -s -o /dev/null -w '%{http_code}' "http://$IP:8080/api/state")" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -u a:b "http://$IP:8080/api/state")" = 200
